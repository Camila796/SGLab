services:
  web:
    image: php:8.2-apache
    container_name: sglab_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public-WEB:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.6
    container_name: sglab_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sglab_db
      MYSQL_USER: sglab_user
      MYSQL_PASSWORD: sglab_password
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sglab.sql:/docker-entrypoint-initdb.d/sglab.sql:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sglab_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword

volumes:
  db_data:
